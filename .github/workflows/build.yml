name: Build Junimod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal application
        run: ./build-mac-app.sh
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent build/Junimod.app build/Junimod-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Junimod-macOS-universal
          path: build/Junimod-macOS-universal.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Junimod-macOS-universal
          path: build
      - uses: softprops/action-gh-release@v2
        with:
          files: build/Junimod-macOS-universal.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
